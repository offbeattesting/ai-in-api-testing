[project]
name = "ecommerce-api"
version = "1.0.0"
description = "A simple e-commerce API for testing purposes"
requires-python = ">=3.10"
dependencies = [
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "fastapi[standard]>=0.135.3",
]

[project.scripts]
fastapi = "fastapi.cli:main"
uvicorn = "uvicorn.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=7.0.0",
]
