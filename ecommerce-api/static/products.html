<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 2rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #6e6e73;
      margin-bottom: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card .price {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0071e3;
    }

    .card .stock {
      font-size: 0.8rem;
      color: #6e6e73;
      margin-top: 0.35rem;
    }

    .card .stock.low {
      color: #d93025;
    }

    .empty {
      text-align: center;
      color: #6e6e73;
      padding: 3rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Products</h1>
    <p class="subtitle">All available products</p>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const grid = document.getElementById('grid');

    async function loadProducts() {
      try {
        const res = await fetch('/products');
        if (!res.ok) throw new Error('Failed to load');
        const products = await res.json();

        if (products.length === 0) {
          grid.innerHTML = '<div class="empty">No products available</div>';
          return;
        }

        grid.innerHTML = products.map(p => `
          <div class="card">
            <h3>${p.name}</h3>
            <div class="price">$${p.price.toFixed(2)}</div>
            <div class="stock${p.stock < 50 ? ' low' : ''}">${p.stock} in stock</div>
          </div>
        `).join('');
      } catch {
        grid.innerHTML = '<div class="empty">Failed to load products</div>';
      }
    }

    loadProducts();
  </script>
</body>

</html>
